<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Map Explorer - Enhanced</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Choices.js CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-shell">
  <div class="container my-4">
    <header class="app-header pb-3 mb-4 border-bottom">
      <div class="d-flex justify-content-between align-items-center gap-2">
        <div>
          <h1 class="h3 mb-1">
            <i class="bi bi-map text-primary me-2"></i>
            Map Explorer
            <span class="badge bg-primary bg-opacity-10 text-primary ms-2">Enhanced</span>
          </h1>
          <p class="text-body-secondary mb-0 small">বাংলাদেশ ভৌগোলিক মানচিত্র ডেটা ব্রাউজার</p>
        </div>
        <button id="resetBtn" class="btn btn-outline-danger">
          <i class="bi bi-arrow-clockwise me-1"></i> রিসেট
        </button>
      </div>
    </header>

    <main>
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <div class="toolbar d-flex justify-content-between align-items-center mb-3 gap-2">
            <div id="status" class="status text-body-secondary flex-grow-1">লোড হচ্ছে...</div>
            <div class="toolbar-actions d-flex gap-2">
              <div id="downloadContainer" class="btn-group">
                <!-- Download button will be inserted here by app.js -->
              </div>
            </div>
          </div>
          <div id="dropdownContainer" class="dropdown-container d-flex flex-column gap-2 mb-3"></div>
          <div id="progressContainer" class="progress-container" style="display: none;"></div>
          <ul id="fileContainer" class="list-group"></ul>
        </div>
      </div>
    </main>

    <footer class="mt-4 pt-4 border-top text-center text-body-secondary">
      <div class="row">
        <div class="col-md-6 text-md-start mb-2 mb-md-0">
          <small>
            <i class="bi bi-shield-check text-success me-1"></i>
            Secure • Offline Support • Modern Features
          </small>
        </div>
        <div class="col-md-6 text-md-end">
          <small>Powered by Edge</small>
        </div>
      </div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Choices.js -->
  <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
  <!-- App logic (data fetch/render) -->
  <script src="app.js"></script>
</body>
</html>
